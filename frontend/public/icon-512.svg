<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - Brand coral color with subtle gradient -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient)"/>

  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8170;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B56;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- SlabDash logo - sized like PrizePicks P (~45% of icon) -->
  <g transform="translate(256, 256) scale(1.2) rotate(-10)">
    <!-- Shadow/back layer -->
    <rect x="-50" y="-55" width="100" height="110" rx="10" fill="#000000" opacity="0.15"/>

    <!-- Main card outer border (cream) -->
    <rect x="-55" y="-60" width="110" height="120" rx="12" fill="#FFF1E3"/>

    <!-- Inner card face (darker salmon for contrast) -->
    <rect x="-48" y="-53" width="96" height="106" rx="8" fill="#FF9B88"/>

    <!-- The "S" shape - cream color, thicker for visibility -->
    <g>
      <!-- Upper curve -->
      <path d="M -22 -28
               C -15 -32, -5 -32, 2 -28
               C 9 -24, 14 -18, 14 -10
               C 14 -2, 9 3, 2 7
               L -3 11"
            stroke="#FFF1E3"
            stroke-width="13"
            stroke-linecap="round"
            stroke-linejoin="round"
            fill="none"/>

      <!-- Lower curve -->
      <path d="M 3 -11
               L -2 -7
               C -9 -3, -14 2, -14 10
               C -14 18, -9 24, -2 28
               C 5 32, 15 32, 22 28"
            stroke="#FFF1E3"
            stroke-width="13"
            stroke-linecap="round"
            stroke-linejoin="round"
            fill="none"/>
    </g>

    <!-- Small highlight on top edge for depth -->
    <rect x="-45" y="-50" width="86" height="3" rx="1.5" fill="#FFFFFF" opacity="0.4"/>
  </g>
</svg>
